<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>VIDGAME</title>
    <link rel="icon" type="imagen/jpeg" href="img/logo.jpeg">
    <style>
        body {
            background-image: url(img/nintendo.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .home {
            position: absolute;
            top: 460px;
            right: 48%;
            width: 31px;
            height: 31px;
            background: rgb(34, 205, 8);
            border-radius: 50%;
        }
        .phone {
            width: 350px;
            background: rgba(0,0,0,0.45);
            border-radius: 40px;
            backdrop-filter: blur(3px);
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
            padding: 20px 25px;
            position: absolute;
            left: 265px;
            top: 120px;
        }
        .app-icon {
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .app-icon img {
            width: 71px;
            height: 71px;
            border-radius: 5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .app-icon:hover img {
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }
        .app-icon p {
            color: white;
            font-size: 12px;
            margin-top: 5px;
            text-shadow: 0 0 5px #000;
        }
        .pop {
            transform: scale(1.25);
        }
        .info-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0,0,0,0.75);
            padding: 20px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            backdrop-filter: blur(3px);
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .info-box img {
            width: 90px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .info-text {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <a href="INDEX.html" class="home"></a>
    <div class="phone">
        <div class="app-icon" onclick="showInfo(
            'Luigi’s Mansion 3',
            'img/lui.jpg',
            'Luigi queda atrapado en un hotel lleno de fantasmas y debe rescatar a sus amigos usando su Poltergust. Aventura divertida, misteriosa y con mucho estilo.'
        )">
            <img src="img/lui.jpg">
            <p>Luigi’s Mansion 3</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Don’t Starve: Nintendo Switch Edition',
            'img/don.jpeg',
            'despiertas en un mundo extraño y oscuro donde todo quiere acabar contigo. Debes buscar recursos, crear herramientas y sobrevivir al hambre, a los monstruos y a la noche. Cada día es un reto y cada error puede ser el último'
        )">
            <img src="img/don.jpeg">
            <p>Don’t Starve</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Super Smash Bros. Ultimate',
            'img/sup.jpg',
            'reúne a los héroes más legendarios del gaming en combates explosivos donde cada segundo cuenta. Con una plantilla gigantesca, escenarios dinámicos y acción frenética, este crossover definitivo promete batallas épicas para jugadores de todos los niveles'
        )">
            <img src="img/sup.jpg">
            <p>Super Smash Bros. Ultimate</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Splatoon 3',
            'img/spl.avif',
            'batallas llenas de color donde la tinta es tu mejor arma. Únete a los Inklings y Octolings, domina nuevos mapas y armas, y pinta el terreno para llevar a tu equipo a la victoria. Rápido, fresco y completamente caótico.'
        )">
            <img src="img/spl.avif">
            <p>Splatoon 3</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Mario Kart 8 Deluxe',
            'img/kart.jpg',
            'lleva la diversión al máximo con carreras frenéticas, personajes icónicos y pistas llenas de locura. Derrapa, usa objetos y desafía a tus amigos en el juego de carreras más divertido y competitivo'
        )">
            <img src="img/kart.jpg">
            <p>Mario Kart 8 Deluxe</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'The Legend of Zelda: Tears of the Kingdom',
            'img/zel.jpg',
            'lleno de islas flotantes, secretos antiguos y libertad total para crear. Acompaña a Link en una aventura épica donde cada idea puede convertirse en una herramienta para sobrevivir y cada descubrimiento abre un nuevo camino.'
        )">
            <img src="img/zel.jpg">
            <p>The Legend of Zelda</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Crash Team Racing Nitro-Fueled',
            'img/crash.png',
            'las carreras más alocadas con gráficos renovados, derrapes precisos y pura velocidad. Compite con tus personajes favoritos, domina las pistas clásicas y demuestra quién es el verdadero campeón del karting.'
        )">
            <img src="img/crash.png">
            <p>Crash Team Racing Nitro-Fueled</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'DOOM Eternal',
            'img/do.jpg',
            'un combate brutal y frenético donde eres la última esperanza contra las hordas del infierno. Corre, dispara y destroza demonios en una campaña explosiva que no te da un segundo para respirar'
        )">
            <img src="img/do.jpg">
            <p>DOOM Eternal</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Alien: Isolation',
            'img/i.avif',
            'te sumerge en una estación espacial oscura donde un xenomorfo letal te acecha sin descanso. Sobrevive escondiéndote, improvisa herramientas y mantén la calma mientras cada paso puede ser el último. Un terror puro, intenso y agobiante'
        )">
            <img src="img/i.avif">
            <p>Alien: Isolation</p>
        </div>
        <div class="app-icon" onclick="showInfo(
            'Mortal Kombat 11',
            'img/mortal.jpg',
            'eleva la brutalidad con combates intensos, gráficos impactantes y una historia llena de giros. Elige a tu luchador, domina sus estilos y desata poderosos Fatalities en uno de los juegos de pelea más explosivos y espectaculares de la saga.”'
        )">
            <img src="img/mortal.jpg">
            <p>Mortal Kombat 11</p>
        </div>
    </div>
    <!-- Ventana de información -->
    <div class="info-box" id="infoBox" onmouseleave="hideInfo()">
        <img id="infoImg">
        <h3 id="infoTitle"></h3>
        <p id="infoDesc" class="info-text"></p>
    </div>
    <script>
        function pop(icon) {
            icon.classList.add("pop");
            setTimeout(() => icon.classList.remove("pop"), 180);
        }
        function showInfo(titulo, imagen, descripcion) {
            pop(event.currentTarget);
            document.getElementById("infoTitle").textContent = titulo;
            document.getElementById("infoImg").src = imagen;
            document.getElementById("infoDesc").textContent = descripcion;
            document.getElementById("infoBox").style.display = "block";
        }
        function hideInfo() {
            document.getElementById("infoBox").style.display = "none";
        }
    </script>
</body>
</html>
